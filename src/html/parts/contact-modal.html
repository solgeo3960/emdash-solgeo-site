<!-- ========== Contact Form Model ========== -->
<div class="contact-btn">
  <div class="contact-btn-txt">Contact</div>
</div>
</div>
<div class="contact-modal background-section">
  <div class="dsn-container contact-inner section-margin">
    <div class="section-title">
      <span class="tag-heading background-section color-heading">Get in touch</span>
      <h2 class="heading-h2">お問い合わせ内容をご入力ください</h2>
    </div>

    <div class="row">
      <div class="col-lg-8">
        <div class="form-box d-flex flex-column">
          <h4 class="title-block p-relative mb-30 text-uppercase border-section-bottom">お問い合わせ</h4>
          <form id="contact-form" class="form w-100" method="post" action="/_emdash/api/plugins/emdash-forms/submit" data-toggle="validator">
            <div class="messages"></div>
<input type="text" name="_hp" value="" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
            <div class="input__wrap controls">
              <div class="form-group">
                <div class="entry-box">
                  <label>お名前*</label>
                  <input id="form_name" type="text" name="name" placeholder="お名前をご入力ください" required="required"
                    data-error="お名前は必須項目です。">
                </div>
                <div class="help-block with-errors"></div>
              </div>

              <div class="form-group">
                <div class="entry-box">
                  <label>メールアドレス *</label>
                  <input id="form_email" type="email" name="email" placeholder="メールアドレスをご入力ください" required="required"
                    data-error="正しいメールアドレスをご入力ください。">
                </div>
                <div class="help-block with-errors"></div>
              </div>

              <div class="form-group">
                <div class="entry-box">
                  <label>お問い合わせ内容 *</label>
                  <textarea id="form_message" class="form-control" name="message" placeholder="お問い合わせ内容をご記入ください"
                    required="required" data-error="お問い合わせ内容は必須です。"></textarea>
                </div>
                <div class="help-block with-errors"></div>
              </div>

              <div class="text-right">
                <div class="image-zoom w-auto d-inline-block move-circle" data-dsn="parallax">
                  <input type="submit" value="Send Message" class="v-light">
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="contact-content d-flex flex-column p-relative background-main box-padding h-100">
          <h4 class="title-block p-relative mb-30 text-uppercase border-section-bottom">
            連絡先
          </h4>

          <div class="content-bottom">
            <div class="item">
              <h5 class="sm-title-block mb-15">Address</h5>
              <p>沖縄県宜野湾市神山1-3-46<br>営業時間 9:00〜18:00</p>
            </div>



            <div class="item">
              <h5 class="sm-title-block mb-15">Phone</h5>
              <a href="tel:090-4560-7481">090-4560-7481</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- ========== End Contact Form Model ========== -->
